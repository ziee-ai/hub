name: Suggest a new MCP server
description: Propose adding a Model-Context-Protocol server to the ziee hub.
title: "[mcp-server] <name>"
labels: ["new-mcp-server"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for **suggesting** an MCP server. To submit one directly, open a PR
        following [CONTRIBUTING.md](../CONTRIBUTING.md).

  - type: input
    id: name
    attributes:
      label: Server name
      placeholder: "Linear MCP"
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [stdio, http, streamable-http]
    validations:
      required: true

  - type: input
    id: command_or_url
    attributes:
      label: Command (stdio) or URL (http / streamable-http)
      placeholder: "npx -y @linear/mcp-server  OR  https://mcp.linear.app"
    validations:
      required: true

  - type: input
    id: upstream
    attributes:
      label: Upstream repo / docs
      placeholder: "https://github.com/linear/mcp"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why add it?
      description: "What does this server expose? Who benefits?"
    validations:
      required: true

  - type: input
    id: min_ziee
    attributes:
      label: Minimum ziee-chat version
      description: "If this server uses a transport / feature introduced in a recent ziee-chat release."
      placeholder: "0.5.0 (optional)"
