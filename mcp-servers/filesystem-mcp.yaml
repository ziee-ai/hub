id: filesystem-mcp
name: filesystem
display_name: Filesystem MCP Server
description: File-system access (read, write, search, list) over MCP. Stdio transport.
category: utilities
tags:
  - filesystem
  - files
  - io
transport_type: stdio
command: npx
args:
  - '-y'
  - '@modelcontextprotocol/server-filesystem'
  - /path/to/allowed/files
environment_variables: {}
# Reinstall flow: bun caches `bunx <pkg>` packages under
# ~/.bun/install/cache/. `bun pm cache rm` is bun's documented cache-
# clear command — no per-package option exists today, so this clears
# the whole bunx cache (side-effect: next bunx call for any package
# also re-fetches).
cleanup_command: bun
cleanup_args:
  - pm
  - cache
  - rm
author: Anthropic
homepage: https://github.com/modelcontextprotocol/servers
repository_url: https://github.com/modelcontextprotocol/servers/tree/main/src/filesystem
documentation_url: https://github.com/modelcontextprotocol/servers/blob/main/src/filesystem/README.md
version: 1.0.0
license: MIT
popularity_score: 95.0
requires_desktop: true
platform_support: [windows, macos, linux]
tool_count: 8
tool_categories: [file-operations, search]
example_tools:
  - read_file
  - write_file
  - search_files
  - list_directory
use_cases:
  - Reading and writing files
  - Searching through file contents
  - Managing file system operations
hub_metadata:
  added_at: '2026-05-29'
  contributor: phibya
  verified: true
