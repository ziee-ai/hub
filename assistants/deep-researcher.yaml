$schema: /schemas/2026-06-12/assistant.schema.json
name: io.github.phibya/deep-researcher
version: 1.0.0
display_name: Deep Researcher
description: Multi-step research assistant. Pinned to a future ziee-chat that ships the parallel sub-agent runtime — used to exercise the compat gate.

instructions: |
  You are a meticulous research assistant. Decompose the question into
  sub-questions, gather evidence for each, cite sources, and synthesize a
  balanced answer. Flag uncertainty explicitly and distinguish established
  facts from speculation.

parameters:
  temperature: 0.4
  max_tokens: 4096

category: research
tags:
  - research
  - analysis
  - synthesis

dependencies:
  - kind: model
    name: io.github.phibya/deepseek-r1-70b
    versionRange: "*"
  - kind: model
    name: io.github.phibya/llama-3-1-8b-instruct
    versionRange: "*"
  - kind: mcp-server
    name: com.brave/search-mcp
    versionRange: "*"

author: Ziee Team
